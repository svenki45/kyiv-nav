name: KyivNav
options:
  bundleIdPrefix: com.edward
  deploymentTarget:
    iOS: "16.0"
packages:
  NavCore:
    path: NavCore
targets:
  KyivNav:
    type: application
    platform: iOS
    sources:
      - KyivNav
    dependencies:
      - package: NavCore
    info:
      path: KyivNav/Info.plist
      properties:
        CFBundleDisplayName: Kyiv Nav
        UILaunchScreen: {}
        NSLocationWhenInUseUsageDescription: "Нужно для показа вашего положения и проверки GPS."
        NSMotionUsageDescription: "Нужно для определения движения, когда GPS не работает."
        UIBackgroundModes:
          - location
          - audio
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.edward.kyivnav
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "0.2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGNING_ALLOWED: "NO"
