name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (no signing)
        shell: bash
        run: |
          xcodebuild \
            -project KyivNav.xcodeproj \
            -scheme KyivNav \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee xcodebuild.log
          test ${PIPESTATUS[0]} -eq 0

      - name: Push build log on failure
        if: failure()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          mkdir -p /tmp/l && cp xcodebuild.log /tmp/l/
          git checkout --orphan build-logs
          git rm -rf . -q
          cp /tmp/l/xcodebuild.log .
          git add -f xcodebuild.log
          git commit -q -m "log"
          git push -f origin build-logs

      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/KyivNav.app Payload/
          zip -r KyivNav.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: KyivNav-ipa
          path: KyivNav.ipa

      - name: Publish IPA to builds branch
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git checkout --orphan builds
          git rm -rf . -q
          git add -f KyivNav.ipa
          git commit -q -m "Build ${GITHUB_SHA}"
          git push -f origin builds
