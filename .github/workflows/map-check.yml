name: Check map data

# Скачивает опубликованную карту и проверяет её на реальных местах Киева.
# Результат кладёт в ветку data-logs (файл map-stats.txt).

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Download map-v1
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download map-v1 --dir out
      - name: Sanity check
        run: python3 tools/sanity_kyiv.py out 2>&1 | tee map-stats.txt
      - name: Publish stats
        if: always()
        run: |
          cp map-stats.txt /tmp/map-stats.txt || echo "нет вывода" > /tmp/map-stats.txt
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git checkout --orphan data-logs
          git rm -rf . -q
          cp /tmp/map-stats.txt map-stats.txt
          git add -f map-stats.txt
          git commit -q -m "Map stats ${GITHUB_SHA}"
          git push -f origin data-logs
